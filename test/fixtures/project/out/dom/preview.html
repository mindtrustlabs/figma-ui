<!DOCTYPE html>
<!-- GENERATED by figma-ui - standalone preview harness for the generated surfaces -->
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Resolve URLs the way the app page does, so <img src> in the fragments works unchanged. -->
<base href="../../">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fixture preview</title>
<link rel="stylesheet" href="./out/dom/hud.css">
<link rel="stylesheet" href="./out/dom/modal.css">
<style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #9fb6c9; }
    .stage { position: absolute; inset: 0; overflow: hidden; }
</style>
</head>
<body>
<div class="stage" id="stage">
<div id="surface-hud"></div>
<div id="surface-modal"></div>
</div>
<script>
    const DESIGN_W = 1920, DESIGN_H = 1080;
    // ?surfaces=a,b limits which surfaces mount.
    const only = new URLSearchParams(location.search).get("surfaces");
    const wanted = only ? only.split(",") : null;
    function applyScale() {
        const s = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
        const root = document.documentElement;
        root.style.setProperty("--ui-scale", String(s));
        root.style.setProperty("--ui-text-floor", s < 0.6 ? "11px" : "0px");
    }
    window.addEventListener("resize", applyScale);
    applyScale();
    if (!wanted || wanted.includes("hud")) fetch("./out/dom/hud.html").then((r) => r.text()).then((t) => {
        document.getElementById("surface-hud").innerHTML = t;
        document.getElementById("surface-hud").dataset.loaded = "1";
    }); else document.getElementById("surface-hud").dataset.loaded = "skipped";
    if (!wanted || wanted.includes("modal")) fetch("./out/dom/modal.html").then((r) => r.text()).then((t) => {
        document.getElementById("surface-modal").innerHTML = t;
        document.getElementById("surface-modal").dataset.loaded = "1";
    }); else document.getElementById("surface-modal").dataset.loaded = "skipped";
</script>
</body>
</html>
